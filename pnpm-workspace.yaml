packages:
  - "packages/*"

# pnpm 11 replaced onlyBuiltDependencies/ignoredBuiltDependencies with a single
# allowBuilds map (package -> true/false). true = run the package's build/postinstall
# script, false = skip it.
allowBuilds:
  '@prisma/engines': true     # Prisma query engine
  prisma: true                # Prisma CLI
  esbuild: true               # bundler used by tsx
  onnxruntime-node: true      # local embeddings (@huggingface/transformers)
  protobufjs: true
  better-sqlite3: false       # transitive Prisma CLI dep; app uses @prisma/adapter-mariadb
  sharp: false                # markitdown image path — not built
  tesseract.js: false         # markitdown OCR path — not built
  unrs-resolver: false
