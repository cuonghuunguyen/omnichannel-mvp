# Stack for the agent-routing sidecar (qdrant + api). ONE file for every host.
#
# Per-host differences (where the DB lives, secrets, the host-gateway address)
# come from the env file + a couple of overridable interpolation vars — NOT from
# a separate compose file. Bring up with:
#
#   docker compose up -d
#
# The `api` container owns its own `agents` database on the relational server
# (separate from the Laravel app DB). All app config + secrets are injected from
# the env file (.env.sidecar, gitignored): DATABASE_URL, INTERNAL_API_SECRET,
# model provider keys, embedding config, …
#
# Reaching the DB (set DATABASE_URL in .env.sidecar accordingly):
#   - Normal host: MySQL reachable by service/hostname on the network. Point
#     DATABASE_URL at it and set SIDECAR_HOST_GATEWAY=host-gateway (or the real
#     DB host) to neutralize the host.docker.internal alias below.
#   - THIS staging host: MariaDB runs on the host (systemd, 127.0.0.1:3306) and
#     rootless Docker (slirp4netns --disable-host-loopback) cannot reach host
#     loopback. A host systemd service (ochats-sidecar-db-shim.service) runs
#     socat on the private host-local address 10.123.0.1:3306 → 127.0.0.1:3306.
#     SIDECAR_HOST_GATEWAY defaults to 10.123.0.1, so the container maps
#     host.docker.internal → the shim, and DATABASE_URL points at
#     host.docker.internal. (10.123.0.1 lives on `lo`, never routed off-host.)
#
# Schema migrations are applied out-of-band: `prisma migrate deploy` against the
# `agents` database (run inside the api container).
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-routing-qdrant
    restart: unless-stopped
    ports:
      - "${FORWARD_QDRANT_PORT:-6333}:6333" # REST
      - "${FORWARD_QDRANT_GRPC_PORT:-6334}:6334" # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # Qdrant ships no shell/curl; hit its bundled binary instead.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: agent-routing-api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env.sidecar
    # Map host.docker.internal → the DB gateway. Defaults to the staging socat
    # shim; override SIDECAR_HOST_GATEWAY (e.g. host-gateway) on other hosts.
    extra_hosts:
      - "host.docker.internal:${SIDECAR_HOST_GATEWAY:-10.123.0.1}"
    environment:
      NODE_ENV: production
      API_PORT: 4000
      QDRANT_URL: http://qdrant:6333
      # DATABASE_URL intentionally NOT set here — it comes from .env.sidecar so
      # each host controls how the api reaches its `agents` database.
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  qdrant-storage:
